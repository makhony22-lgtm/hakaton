<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Добавить вакансию - Jumys AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="box onboarding-box">
<h2>Добавить вакансию</h2>
<p class="subtitle">Заполните информацию о вакансии</p>

<div class="profile-section">
  <label>Название вакансии *</label>
  <input type="text" id="jobTitle" placeholder="Например: Воспитатель">
</div>

<div class="profile-section">
  <label>Категория/Сфера *</label>
  <input type="text" id="jobCategory" placeholder="Например: Образование и воспитание">
</div>

<div class="profile-section">
  <label>Зарплата *</label>
  <input type="text" id="jobSalary" placeholder="Например: от 180 000 до 200 000 тг.">
</div>

<div class="profile-section">
  <label>Город *</label>
  <select id="jobLocation">
    <option value="">Выберите город</option>
    <option value="Алматы">Алматы</option>
    <option value="Астана">Астана</option>
    <option value="Шымкент">Шымкент</option>
    <option value="Караганда">Караганда</option>
    <option value="Актобе">Актобе</option>
    <option value="Тараз">Тараз</option>
    <option value="Павлодар">Павлодар</option>
    <option value="Усть-Каменогорск">Усть-Каменогорск</option>
    <option value="Семей">Семей</option>
    <option value="Атырау">Атырау</option>
    <option value="Костанай">Костанай</option>
    <option value="Кызылорда">Кызылорда</option>
    <option value="Уральск">Уральск</option>
    <option value="Петропавловск">Петропавловск</option>
    <option value="Актау">Актау</option>
  </select>
</div>

<div class="profile-section">
  <label>Район/Адрес</label>
  <input type="text" id="jobDistrict" placeholder="Например: район Сарыарка">
</div>

<div class="profile-section">
  <label>Опыт работы *</label>
  <select id="jobExperience">
    <option value="">Выберите требуемый опыт</option>
    <option value="Без опыта работы">Без опыта работы</option>
    <option value="От 1 года">От 1 года</option>
    <option value="От 2 лет">От 2 лет</option>
    <option value="От 3 лет">От 3 лет</option>
    <option value="От 5 лет">От 5 лет</option>
  </select>
</div>

<div class="profile-section">
  <label>Тип занятости *</label>
  <select id="jobEmploymentType">
    <option value="">Выберите тип занятости</option>
    <option value="Полная занятость">Полная занятость</option>
    <option value="Частичная занятость">Частичная занятость</option>
    <option value="Стажировка">Стажировка</option>
    <option value="Проектная работа">Проектная работа</option>
    <option value="Удаленная работа">Удаленная работа</option>
  </select>
</div>

<div class="profile-section">
  <label>Образование *</label>
  <select id="jobEducation">
    <option value="">Выберите требуемое образование</option>
    <option value="Среднее">Среднее</option>
    <option value="Среднее специальное">Среднее специальное</option>
    <option value="Неоконченное высшее">Неоконченное высшее</option>
    <option value="Высшее">Высшее</option>
    <option value="Бакалавр">Бакалавр</option>
    <option value="Магистр">Магистр</option>
  </select>
</div>

<div class="profile-section">
  <label>Описание вакансии</label>
  <textarea id="jobDescription" placeholder="Опишите обязанности, требования и условия работы"></textarea>
</div>

<div class="profile-section">
  <label>Требуемые навыки</label>
  <input type="text" id="jobRequirements" placeholder="Например: Педагогика, Работа с детьми, Коммуникабельность (через запятую)">
  <small>Введите навыки через запятую</small>
</div>

<button id="submitJob">Опубликовать вакансию</button>
<button onclick="location.href='index.html'" class="btn-secondary">Отмена</button>

</div>

<script type="module" src="./add-job.js"></script>
</body>
</html>
