<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Главная</title>
<style>
body{margin:0;font-family:Segoe UI;background:#f4f6fb;padding:20px}
header{display:flex;justify-content:space-between;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}
.card{background:white;padding:15px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.08)}
button{padding:8px 12px;border:none;border-radius:8px;background:#4f46e5;color:white;cursor:pointer}
</style>
</head>
<body>

<header>
<div>👤 <span id="userEmail"></span></div>
<div>
<button onclick="logout()">Выйти</button>
</div>
</header>

<h2>Подбор ВУЗа</h2>

<div class="cards" id="cards"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
