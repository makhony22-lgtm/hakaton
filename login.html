<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход</title>
<style>
body{display:flex;height:100vh;justify-content:center;align-items:center;background:#f4f6fb;font-family:Segoe UI}
.box{background:white;padding:40px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.1);width:320px;text-align:center}
input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ddd}
button{width:100%;padding:10px;margin-top:10px;border:none;border-radius:8px;background:#4f46e5;color:white;cursor:pointer}
button:hover{background:#3730a3}
</style>
</head>
<body>

<div class="box">
<h2>UniGuide</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Пароль">
<button onclick="login()">Вход</button>
<button onclick="register()">Регистрация</button>
</div>

<script type="module" src="./auth.js"></script>
</body>
</html>
